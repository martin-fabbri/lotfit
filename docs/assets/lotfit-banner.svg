<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-label="LotFit: does it fit? Every number traced to its code clause.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3fd0b0" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="430" rx="18" fill="#0d1a17"/>
  <rect width="1280" height="430" rx="18" fill="url(#grid)"/>
  <!-- hackathon entry: full-width band -->
  <path d="M18 0H1262A18 18 0 0 1 1280 18V84H0V18A18 18 0 0 1 18 0Z" fill="#f5b342"/>
  <text x="640" y="40" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="2" fill="#0d1a17">HACKATHON ENTRY · META GLOBAL AI DEVELOPER HACKATHON</text>
  <text x="640" y="68" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0d1a17">Hosted by Meta · run by Cerebral Valley · Indie Developer track · October 27 – November 4, 2026</text>
  <!-- wordmark -->
  <text x="96" y="236" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="112" letter-spacing="-3" fill="#f2f6f4">LotFit</text>
  <text x="100" y="286" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-weight="500" font-size="26" fill="#9fb3ad">Does it fit? Every number traced to its code clause.</text>
  <!-- verdict chips -->
  <g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <rect x="100" y="318" width="62" height="28" rx="6" fill="#3fd0b0" fill-opacity=".14" stroke="#3fd0b0" stroke-opacity=".6"/>
    <text x="131" y="337" text-anchor="middle" fill="#3fd0b0">FITS</text>
    <rect x="172" y="318" width="86" height="28" rx="6" fill="#3fd0b0" fill-opacity=".10" stroke="#3fd0b0" stroke-opacity=".45"/>
    <text x="215" y="337" text-anchor="middle" fill="#3fd0b0">FITS IF</text>
    <rect x="268" y="318" width="48" height="28" rx="6" fill="#ff6b6b" fill-opacity=".12" stroke="#ff6b6b" stroke-opacity=".55"/>
    <text x="292" y="337" text-anchor="middle" fill="#ff6b6b">NO</text>
    <rect x="326" y="318" width="196" height="28" rx="6" fill="#f5b342" fill-opacity=".12" stroke="#f5b342" stroke-opacity=".55"/>
    <text x="424" y="337" text-anchor="middle" fill="#f5b342">TOO CLOSE TO CALL</text>
  </g>
  <!-- the mark: lot outline, house, the cottage -->
  <g transform="translate(900 112)">
    <rect x="0" y="0" width="190" height="272" fill="none" stroke="#3fd0b0" stroke-width="3" stroke-dasharray="10 6"/>
    <rect x="62" y="18" width="66" height="66" fill="#3fd0b0" fill-opacity=".85"/>
    <path d="M14 98 H176 V244 H104 V222 H14 Z" fill="#3fd0b0" fill-opacity=".10" stroke="#3fd0b0" stroke-width="2.5"/>
    <text x="95" y="300" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#6f8a83">STREET</text>
  </g>
</svg>
