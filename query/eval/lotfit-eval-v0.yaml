      - "Does any Portland or Gresham rule override a state statute?"
      - "Is there anything in the city codes recorded as displacing Oregon law?"
    gold_cypher: |
      MATCH (c:Provision)-[:PREEMPTS]->(s:Provision)
      WHERE c.layer IN ['PDX', 'GRE'] AND s.layer = 'OR'
      RETURN c.id AS city_provision, s.id AS state_provision
    compare_on: [ city_provision, state_provision ]
    expected: []
    expect_empty: true
    notes: "Direction trap: preemption runs state -> city only. Empty is right."

  # ---------------------------------------------------------------- exceptions (MODIFIES) and the setback family
  - id: E021
    patterns: [ modifies, exception, modeled-layer ]
    as_of: null
    questions:
      - "Exceptions that MODIFY PDX.33.110.220.B directly."
      - "Which exceptions relax Portland's required setbacks?"
      - "What carve-outs loosen the base setback rule of 33.110.220.B (one step, not exceptions to exceptions)?"
    gold_cypher: |
      MATCH (e:Provision)-[r:MODIFIES]->(:Provision {id: 'PDX.33.110.220.B'})
      RETURN e.id AS exception_id, r.quote AS quote
    compare_on: [ exception_id ]
    expected:
      - { "exception_id": "PDX.33.110.220.C.1" }
      - { "exception_id": "PDX.33.110.220.C.2" }
      - { "exception_id": "PDX.33.110.220.C.3" }
      - { "exception_id": "PDX.33.110.220.D.1" }
      - { "exception_id": "PDX.33.110.220.D.4.a" }
      - { "exception_id": "PDX.33.110.245.C.2" }
    expect_empty: false
    notes: |-
      Six: 245.C.2 (accessory structures in side/rear setbacks), 220.D.1 (averaging), 220.D.4.a (steep lots), 220.C.1, C.2 (eaves), C.3. 220.D.4.c modifies D.4.a, not 220.B, so it is excluded here (see E022).

  - id: E022
    patterns: [ modifies, exception, multi-hop, variable-length ]
    as_of: null
    questions:
      - "All provisions that modify PDX.33.110.220.B directly or through another exception, with depth."
      - "Which rules change Portland's base setbacks, counting exceptions to exceptions?"
      - "Trace every carve-out that ends up altering the required-setback rule, however many steps removed."
    gold_cypher: |
      MATCH path = (e:Provision)-[:MODIFIES*1..]->(:Provision {id: 'PDX.33.110.220.B'})
      RETURN e.id AS exception_id, length(path) AS depth
    compare_on: [ exception_id, depth ]
    expected:
      - { "exception_id": "PDX.33.110.220.C.1", "depth": 1 }
      - { "exception_id": "PDX.33.110.220.C.2", "depth": 1 }
      - { "exception_id": "PDX.33.110.220.C.3", "depth": 1 }
      - { "exception_id": "PDX.33.110.220.D.1", "depth": 1 }
      - { "exception_id": "PDX.33.110.220.D.4.a", "depth": 1 }
      - { "exception_id": "PDX.33.110.245.C.2", "depth": 1 }
      - { "exception_id": "PDX.33.110.220.D.4.c", "depth": 2 }
    expect_empty: false
    notes: "The six of E021 at depth 1 plus 220.D.4.c at depth 2 (it lowers the height limit inside a reduced front setback)."

  - id: E023
    patterns: [ param, exception, adu-standard ]
    as_of: "2026-11-01"
    questions:
      - "PDX 33.110.245.C.2 thresholds for accessory structures in side/rear setbacks."
