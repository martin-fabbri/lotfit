      Gresham has 24 Readings but no curated gray-area effects yet (SCHEMA.md: curated relations and effects cover only the Portland detached-ADU slice). Answering from Readings invents a settler.

  # ---------------------------------------------------------------- operators, tools, facts
  - id: E033
    patterns: [ operator, tool, facts-needed, modeled-layer ]
    as_of: null
    questions:
      - "Operator + tool for PDX.33.205.040.C.2 and facts read."
      - "How does the engine check Portland's 40-ft-or-behind-the-house ADU rule, and what inputs does it need?"
      - "Which operator evaluates the ADU front placement rule, what tool does it run, and which site/plan facts does it consume?"
    gold_cypher: |
      MATCH (o:Operator)-[:MODELS]->(:Provision {id: 'PDX.33.205.040.C.2'})
      MATCH (o)-[:RUNS_TOOL]->(t:Tool)
      MATCH (o)-[:READS_FACT]->(f:Fact)
      RETURN o.id AS operator, t.id AS tool, f.id AS fact
    compare_on: [ operator, tool, fact ]
    expected:
      - { "operator": "op.adu_front_or_behind", "tool": "check_front_or_behind", "fact": "plan.outline" }
      - { "operator": "op.adu_front_or_behind", "tool": "check_front_or_behind", "fact": "site.front_lot_line" }
      - { "operator": "op.adu_front_or_behind", "tool": "check_front_or_behind", "fact": "site.house_outline" }
      - { "operator": "op.adu_front_or_behind", "tool": "check_front_or_behind", "fact": "site.house_rear_wall" }
      - { "operator": "op.adu_front_or_behind", "tool": "check_front_or_behind", "fact": "site.lot_outline" }
      - { "operator": "op.adu_front_or_behind", "tool": "check_front_or_behind", "fact": "site.structures" }
    expect_empty: false
    notes: |-
      op.adu_front_or_behind runs check_front_or_behind (signed "behind the rear wall", W4 2026-11-01; was check_setback); reads lot outline, front lot line, house outline, structures, house rear wall, plan outline. One row per fact.

