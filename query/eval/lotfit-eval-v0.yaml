      RETURN g.id AS effect_id, g.status AS status, g.settled_by AS settled_by, g.matters_when_json AS matters_when, r.phrase AS phrase
    compare_on: [ effect_id, status, settled_by, matters_when ]
    expected:
      - { "effect_id": "amb.adu-size.common-area", "status": "active", "settled_by": "Portland BDS", "matters_when": "[{\"fact\": \"plan.detached\", \"op\": \"==\", \"value\": false}]" }
