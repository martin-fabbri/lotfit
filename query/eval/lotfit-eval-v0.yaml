  - id: E019
    patterns: [ preempts, layering, modeled-layer ]
    as_of: null
    questions:
      - "PREEMPTS edges: state provision -> city provision, with quote and status."
      - "Which Portland rule does state law override, and on what words?"
      - "Is any city standard in the graph recorded as displaced by Oregon law? Give the statute, the city rule and the quoted basis."
    gold_cypher: |
      MATCH (s:Provision)-[r:PREEMPTS]->(c:Provision)
      RETURN s.id AS state_provision, c.id AS city_provision, r.quote AS quote, r.status AS status
    compare_on: [ state_provision, city_provision, status ]
    expected:
      - { "state_provision": "ORS.197A.400.1", "city_provision": "PDX.33.110.220.B", "status": "provisional" }
    expect_empty: false
    notes: |-
      ORS 197A.400(1) (clear and objective standards) -> PDX.33.110.220.B, provisional. The edge note says it bites only where a standard is not clear and objective; Portland's setbacks are numeric. A judgment by CC, recorded as such.

  - id: E020
    patterns: [ preempts, empty, direction ]
