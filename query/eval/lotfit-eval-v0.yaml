    notes: |-
      C.3.a 20 percent of site area combined; C.3.b 900 sq ft ("or 900 square feet, whichever is greater", p.26; the other branch of that comparison is not a parameter). Overall building coverage is Table 110-5, cell text only.

  # ---------------------------------------------------------------- clause ledger: what is not modeled
  - id: E025
    patterns: [ clause-ledger, not-modeled, facts-needed ]
    as_of: "2026-11-01"
    questions:
      - "Not-modeled clauses in PDX.33.110.245.C.2 + needs."
      - "Which parts of Portland's accessory-structure setback exception aren't modeled, and what facts would we need?"
      - "For the side/rear setback exception, list the conditions the engine can't evaluate yet and the inputs each one asks for."
    gold_cypher: |
      MATCH (:Provision {id: 'PDX.33.110.245.C.2'})-[:HAS_VERSION]->(v:Version)-[:HAS_CLAUSE]->(c:Clause {status: 'not_modeled'})
      WHERE (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN c.clause_id AS clause_id, c.needs AS needs
    compare_on: [ clause_id, needs ]
    expected:
      - { "clause_id": "condition:b.(2)/excluding#1", "needs": [ "plan.eave_ft" ] }
      - { "clause_id": "condition:b.(3)/if#1", "needs": [ "site.other_structures_in_setback", "plan.setbacks_used" ] }
      - { "clause_id": "condition:b.(4)/excluding#1", "needs": [ "plan.gable_walls" ] }
      - { "clause_id": "condition:b.(5)/unless#1", "needs": [ "plan.setbacks_used" ] }
      - { "clause_id": "condition:b./other_than#1", "needs": [ "plan.is_cistern", "plan.setbacks_used" ] }
      - { "clause_id": "item:b.(5)", "needs": [ "site.screening", "plan.setbacks_used" ] }
      - { "clause_id": "item:b.(6)", "needs": [ "plan.openings_facing_lot_line", "plan.setbacks_used" ] }
      - { "clause_id": "item:b.(7)", "needs": [ "plan.rooftop_deck" ] }
      - { "clause_id": "sentence:2", "needs": [ "plan.setbacks_used" ] }
    expect_empty: false
    notes: |-
      The setback sentence, the cistern carve-out, "excluding eaves", the multiple-structure condition, the gable exclusion, screening (5) and its "unless", openings (6), rooftop deck (7). Needs come from the lexicon, not a model.

