      - { "exception_id": "PDX.33.110.220.C.1" }
      - { "exception_id": "PDX.33.110.220.C.2" }
      - { "exception_id": "PDX.33.110.220.C.3" }
      - { "exception_id": "PDX.33.110.220.D.1" }
      - { "exception_id": "PDX.33.110.220.D.4.a" }
    expect_empty: false
    notes: |-
      Five: 220.C.1, C.2 (eaves), C.3, D.1 (averaging), D.4.a (steep lots). 245.C.2 is modeled (op.accessory_in_setback, op.footprint_dimension). An exception with no operator is a NEEDS_CHECK candidate when its conditions can hold.

  # ---------------------------------------------------------------- definitions and terms
  - id: E038
    patterns: [ definition, uses-definition, adu-standard ]
    as_of: null
    questions:
      - "Definitions used by PDX.33.205.040.C.1."
      - "Which definitions does Portland's ADU size rule depend on?"
      - "To apply the ADU living-area cap, which defined terms must I look up?"
    gold_cypher: |
      MATCH (:Provision {id: 'PDX.33.205.040.C.1'})-[:USES_DEFINITION]->(d:Provision)
      RETURN d.id AS definition_id, d.type AS type
    compare_on: [ definition_id, type ]
    expected:
      - { "definition_id": "PDX.33.910.030.accessory-dwelling-unit.part2", "type": "definition" }
      - { "definition_id": "PDX.33.910.030.accessory-dwelling-unit", "type": "definition" }
      - { "definition_id": "PDX.33.910.030.living-area", "type": "definition" }
    expect_empty: false
    notes: "ADU definition (two page-split parts) and Living Area (33.910.030)."

  - id: E039
    patterns: [ definition, uses-definition, multi-hop, variable-length ]
    as_of: null
    questions:
      - "Transitive definition closure of PDX.33.205.040.C.1."
      - "Following definitions inside definitions, everything the ADU size rule ultimately relies on?"
      - "Chase the definition chain from Portland's ADU size cap to the bottom: which definitions are reachable?"
    gold_cypher: |
      MATCH (:Provision {id: 'PDX.33.205.040.C.1'})-[:USES_DEFINITION*1..]->(d:Provision)
      RETURN DISTINCT d.id AS definition_id
    compare_on: [ definition_id ]
    expected:
      - { "definition_id": "PDX.33.910.030.accessory-dwelling-unit.part2" }
      - { "definition_id": "PDX.33.910.030.accessory-dwelling-unit" }
      - { "definition_id": "PDX.33.910.030.basement" }
      - { "definition_id": "PDX.33.910.030.building" }
      - { "definition_id": "PDX.33.910.030.dwelling-unit" }
      - { "definition_id": "PDX.33.910.030.grade" }
      - { "definition_id": "PDX.33.910.030.gross-building-area" }
      - { "definition_id": "PDX.33.910.030.living-area" }
      - { "definition_id": "PDX.33.910.030.lot" }
      - { "definition_id": "PDX.33.910.030.structure" }
    expect_empty: false
    notes: |-
      Reaches ADU, living area, then basement, dwelling unit, lot, gross building area, grade, building, structure. DISTINCT matters: several paths reach the same definition.

  - id: E040
    patterns: [ definition, defines, term, citation ]
    as_of: null
    questions:
      - "PDX term 'living area': defining provision, document, page."
      - "Where does Portland define 'living area'?"
      - "Which section, document and page give Portland's meaning of living area for ADU sizing?"
    gold_cypher: |
      MATCH (d:Provision)-[:DEFINES]->(t:Term {id: 'PDX:living area'})
      MATCH (d)-[:HAS_VERSION]->(v:Version)-[:FROM_DOCUMENT]->(doc:Document)
      RETURN d.id AS provision_id, doc.id AS document_id, v.page AS page
    compare_on: [ provision_id, document_id, page ]
    expected:
      - { "provision_id": "PDX.33.910.030.living-area", "document_id": "DOC-PDX-T33COMPLETE", "page": 1836 }
    expect_empty: false
    notes: |-
      PDX.33.910.030.living-area in the compiled Title 33 (DOC-PDX-T33COMPLETE), page 1836 of that PDF. Term ids are layer-prefixed and lower-case.

  - id: E041
    patterns: [ term, uses-term, defines, empty ]
    as_of: null
    questions:
      - "Defining provision for PDX term 'primary dwelling unit'."
      - "Where does Portland define 'primary dwelling unit'?"
      - "The ADU definition leans on 'primary dwelling unit': which provision in the graph defines that phrase?"
    gold_cypher: |
      MATCH (d:Provision)-[:DEFINES]->(t:Term {id: 'PDX:primary dwelling unit'})
      RETURN d.id AS provision_id
    compare_on: [ provision_id ]
    expected: []
    expect_empty: true
    notes: |-
      The Term exists (USES_TERM from both ADU definition parts) but nothing DEFINES it in the graph. Answering with 'primary structure' or 'dwelling unit' substitutes a different term. Not-stated is the answer.

  - id: E042
    patterns: [ definition, defines, quote, gresham ]
    as_of: null
    questions:
      - "GRE accessory dwelling definition text."
      - "How does Gresham define an accessory dwelling?"
      - "Quote me Gresham's definition of the term for a granny flat."
    gold_cypher: |
      MATCH (d:Provision)-[:DEFINES]->(:Term {id: 'GRE:accessory dwelling'})
      MATCH (d)-[:HAS_VERSION]->(v:Version)
      RETURN d.id AS provision_id, v.text AS text, v.page AS page
    compare_on: [ provision_id, page ]
    expected:
      - { "provision_id": "GRE.3.0100.ACCESSORY-DWELLING", "page": 24 }
    expect_empty: false
    notes: "GRE.3.0100.ACCESSORY-DWELLING; the text says it is accessory to a single detached dwelling (see Reading on 10.0110)."

  # ---------------------------------------------------------------- cross-references and Gresham multi-hop
  - id: E043
    patterns: [ refers-to, gresham ]
    as_of: null
    questions:
      - "REFERS_TO targets of GRE.10.0110.D."
      - "What does Gresham's ADU height rule point to?"
      - "Which other part of the Gresham code does the ADU height standard send me to?"
    gold_cypher: |
      MATCH (:Provision {id: 'GRE.10.0110.D'})-[:REFERS_TO]->(t:Provision)
      RETURN t.id AS provision_id
    compare_on: [ provision_id ]
    expected:
      - { "provision_id": "GRE.T4.0130" }
    expect_empty: false
    notes: |-
      GRE.T4.0130 (district standards). Its USES_DEFINITION to Building Height is a different edge and should not be returned for "points to".

  - id: E044
    patterns: [ multi-hop, refers-to, param-by-zone, gresham ]
    as_of: "2026-11-01"
    questions:
      - "GRE ADU height cap in LDR-5 via 10.0110.D's referenced table."
      - "In Gresham's LDR-5, what is the district height limit an ADU must also respect?"
      - "Follow Gresham's ADU height rule to its district table: what number applies on an LDR-5 lot?"
    gold_cypher: |
      MATCH (:Provision {id: 'GRE.10.0110.D'})-[:REFERS_TO]->(t:Provision)-[:HAS_VERSION]->(v:Version)-[:HAS_PARAMETER]->(pa:Parameter)-[:APPLIES_TO_ZONE]->(:Zone {id: 'GRE:LDR-5'})
      WHERE pa.name STARTS WITH 'h_maximum_building_height'
        AND (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN t.id AS provision_id, pa.value_num AS value, pa.unit AS unit, pa.footnotes AS footnotes
    compare_on: [ provision_id, value, unit, footnotes ]
    expected:
      - { "provision_id": "GRE.T4.0130", "value": 35, "unit": "ft", "footnotes": [ "12", "11" ] }
    expect_empty: false
    notes: |-
      35 ft with footnotes [11] and [12]; the LDR-5 cell prints "35 ft.12". The ADU is further capped at the house's height (10.0110.D), which is a comparison, not a number.

  # ---------------------------------------------------------------- types and topics
  - id: E045
    patterns: [ provision-type, topic, gresham ]
    as_of: "2026-11-01"
    questions:
      - "GRE exceptions on height (T04)."
      - "Which Gresham exceptions bear on building height?"
      - "What carve-outs from Gresham's height rules are in the graph?"
    gold_cypher: |
      MATCH (p:Provision {layer: 'GRE', type: 'exception'})-[:HAS_VERSION]->(v:Version)
      WHERE 'T04' IN p.topics
        AND (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN p.id AS provision_id, p.title AS title
    compare_on: [ provision_id ]
    expected:
      - { "provision_id": "GRE.10.0110.L.2" }
      - { "provision_id": "GRE.9.0901.B.p1" }
      - { "provision_id": "GRE.9.0901.B.p2" }
    expect_empty: false
    notes: "10.0110.L.2 (rear roof height reductions) and 9.0901.B (projections above the maximum height, two page parts)."

  - id: E046
    patterns: [ provision-type, gate, in-force, adu-standard ]
    as_of: "2026-11-01"
    questions:
      - "PDX gates in the ADU chapter (title mentions accessory dwelling units), in force 2026-11-01."
      - "Which Portland rules decide whether an ADU is allowed at all?"
      - "In Portland's accessory-dwelling chapter, which provisions are pass/fail conditions on having an ADU, as of today?"
    gold_cypher: |
      MATCH (p:Provision {layer: 'PDX', type: 'gate'})-[:HAS_VERSION]->(v:Version)
      WHERE toLower(p.title) CONTAINS 'accessory dwelling'
        AND (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN p.id AS provision_id, p.title AS title
    compare_on: [ provision_id ]
    expected:
      - { "provision_id": "PDX.33.205.020.A" }
      - { "provision_id": "PDX.33.205.020.B.1.a" }
      - { "provision_id": "PDX.33.205.020.B.1.b" }
      - { "provision_id": "PDX.33.205.020.B.1.c.1" }
      - { "provision_id": "PDX.33.205.020.B.1.c.2" }
      - { "provision_id": "PDX.33.205.020.B.2.a" }
      - { "provision_id": "PDX.33.205.020.B.2.b" }
      - { "provision_id": "PDX.33.205.030.A" }
      - { "provision_id": "PDX.33.205.030.B" }
      - { "provision_id": "PDX.33.205.040.C.4.b" }
    expect_empty: false
    notes: |-
      The 33.205.020 "Where ... Allowed" family plus the 33.205.030/040 gates. Table 110-2 (E047) is also a gate but its title does not name ADUs; the question scopes to the ADU chapter, so it is excluded. Type comes from the extraction.

  - id: E047
    patterns: [ param-by-zone, table-cell, gate ]
    as_of: "2026-11-01"
    questions:
      - "PDX Table 110-2: ADU allowed in RF?"
      - "Is an accessory dwelling unit allowed in Portland's RF zone?"
      - "Does the housing-types table permit an ADU on a farm/forest-zoned lot?"
    gold_cypher: |
      MATCH (v:Version)-[:HAS_PARAMETER]->(pa:Parameter)-[:APPLIES_TO_ZONE]->(:Zone {id: 'PDX:RF'})
      MATCH (pa)-[:FROM_CELL]->(c:TableCell)
      WHERE c.table = 'Table 110-2' AND toLower(c.row) CONTAINS 'accessory dwelling'
        AND (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN pa.value_bool AS allowed, c.cell AS cell, pa.provision_id AS provision_id
    compare_on: [ allowed, cell, provision_id ]
    expected:
      - { "allowed": true, "cell": "Yes", "provision_id": "PDX.T110-2" }
    expect_empty: false
    notes: |-
      Yes (cell "Yes", p.8). Note 33.205.020.B.1.a speaks of R20 through R2.5; RF has its own paragraph, not in the slice. The table answers the question asked.

  - id: E048
    patterns: [ param, gate, in-force, trees ]
    as_of: "2026-11-01"
    questions:
      - "PDX tree-plan trigger diameters (11.50.020)."
      - "At what tree sizes does Portland require a tree plan for development?"
      - "Which trunk diameters for private, City and street trees trigger Portland's tree plan?"
    gold_cypher: |
      MATCH (:Provision {id: 'PDX.11.50.020'})-[:HAS_VERSION]->(v:Version)-[:HAS_PARAMETER]->(pa:Parameter)
      WHERE (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN pa.value_num AS value, pa.unit AS unit, pa.quote AS quote
    compare_on: [ value, unit ]
    expected:
      - { "value": 12, "unit": "in" }
      - { "value": 3, "unit": "in" }
      - { "value": 6, "unit": "in" }
    expect_empty: false
    notes: |-
      12 in private, 6 in City, 3 in street trees (in force from 2025-10-24). The "and/or" joining them is a gray area (E030), so the thresholds are facts but their combination is not.

  - id: E049
    patterns: [ topic, empty, solar ]
    as_of: "2026-11-01"
    questions:
      - "PDX solar setback provisions (T16) in force."
      - "Does Portland have a solar setback rule that limits where a new ADU can go?"
      - "Is there any Portland rule protecting the lot to the north from new shade by a structure?"
    gold_cypher: |
      MATCH (p:Provision {layer: 'PDX'})-[:HAS_VERSION]->(v:Version)
      WHERE 'T16' IN p.topics
        AND (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN p.id AS provision_id
    compare_on: [ provision_id ]
    expected: []
    expect_empty: true
    notes: |-
      None in the graph. Chapter 33.639 Solar Access is tagged T25/T20 and its deletion notice says it was deleted; returning it is wrong. "Not in the graph" is the honest answer, not "no such rule exists" (coverage not checked here).

  - id: E050
    patterns: [ citation, table-cell, document ]
    as_of: "2026-11-01"
    questions:
      - "Cite PDX R5 side setback: doc title, edition, page, cell text."
      - "Where does the 5-ft side setback for R5 come from, exactly?"
      - "Give the source for the R5 side-yard number: which document, which edition, which page, and what the cell says."
    gold_cypher: |
      MATCH (c:TableCell {table: 'Table 110-4', row: 'Side building setback', column: 'R5'})<-[:HAS_TABLE_CELL]-(v:Version)-[:FROM_DOCUMENT]->(d:Document)
      RETURN d.title AS document, d.version AS edition, c.page AS page, c.cell AS cell, c.position AS position
    compare_on: [ document, edition, page, cell ]
    expected:
      - { "document": "Title 33, Chapter 33.110 Single-Dwelling Zones", "edition": "11/1/26", "page": 11, "cell": "5 ft." }
    expect_empty: false
    notes: "Title 33, Chapter 33.110 Single-Dwelling Zones, edition 11/1/26, p.11, '5 ft.' (row_sequence evidence)."
