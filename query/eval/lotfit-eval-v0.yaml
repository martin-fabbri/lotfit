      - { "effect_id": "amb.tree-plan.when-not-required", "provision_id": "PDX.11.50.020", "status": "active" }
    expect_empty: false
    notes: "Two, both active: the tree-plan 'and/or' (11.50.020) and 'New development' (11.50.050.A)."

  - id: E031
    patterns: [ gray-area-effect, settled-by, matters-when, modeled-layer ]
