  # ---------------------------------------------------------------- gray areas
  - id: E028
    patterns: [ reading, gray-area, gresham ]
    as_of: "2026-11-01"
    questions:
      - "Readings on GRE ADU height rule (10.0110.D): phrases + options."
      - "Is Gresham's ADU height rule ambiguous anywhere? What are the possible readings?"
      - "Where does Gresham's 'no taller than the house' rule leave room for interpretation, and what are the competing views?"
    gold_cypher: |
      MATCH (:Provision {id: 'GRE.10.0110.D'})-[:HAS_VERSION]->(v:Version)-[:HAS_READING]->(r:Reading)
      WHERE (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN r.phrase AS phrase, size(r.readings) AS n_readings
    compare_on: [ phrase, n_readings ]
    expected:
      - { "phrase": "applicable height standards of the land use district", "n_readings": 2 }
      - { "phrase": "shall not exceed the height of the primary dwelling", "n_readings": 2 }
    expect_empty: false
    notes: |-
      Two phrases: "shall not exceed the height of the primary dwelling" (own-grade height vs absolute elevation) and "applicable height standards of the land use district". Two readings each. Readings are never settled in the graph.

  - id: E029
    patterns: [ reading, gray-area, table-cell, gresham ]
    as_of: "2026-11-01"
    questions:
      - "Reading on GRE Table 10.0110 street setback for freestanding ADUs."
      - "What does 'no closer than the primary dwelling' mean for a Gresham ADU's street setback? Is it settled?"
      - "Gresham's detached-ADU street setback is relative to the house: what are the recorded interpretations?"
    gold_cypher: |
      MATCH (:Provision {id: 'GRE.T10.0110'})-[:HAS_VERSION]->(v:Version)-[:HAS_READING]->(r:Reading)
      WHERE (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      UNWIND r.readings AS reading
      RETURN r.id AS reading_id, reading
    compare_on: [ reading_id, reading ]
    expected:
      - { "reading_id": "GRE.T10.0110#v1::reading:0", "reading": "The ADU may be no closer to the street lot line than the closest point of the primary dwelling" }
      - { "reading_id": "GRE.T10.0110#v1::reading:0", "reading": "The ADU may be no closer to the street than the primary dwelling's front facade/wall (its front setback line), as in 10.0203.C for accessory structures" }
    expect_empty: false
    notes: |-
      Closest point of the primary dwelling vs its front facade line (as in 10.0203.C). The Reading's phrase is the table caption, not the cell text, so a match on phrase CONTAINS 'closer' fails: a deliberate trap.

  - id: E030
    patterns: [ gray-area-effect, settled-by, modeled-layer ]
    as_of: null
    questions:
      - "Gray-area effects settled by Urban Forestry."
      - "Which open interpretation questions does Portland's Urban Forestry have to decide?"
      - "For which unresolved code readings is the tree office the body that settles them, and on which provisions?"
