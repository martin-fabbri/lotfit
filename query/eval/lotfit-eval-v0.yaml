# LotFit query eval set v0: natural-language questions an ADU evaluator asks the code graph, each with a gold Cypher
# query and the rows that query returned on the graph load named below. Written blind to the query ontology.
# Scoring: run the candidate query, project each row onto `compare_on`, compare as a multiset (order-insensitive)
# to `expected`. Lists inside a cell compare order-insensitively too. `expect_empty: true` means the right answer is
# "nothing in the graph", and any returned row is wrong.
# Regenerate or verify `expected`: node run-gold.mjs [--write]   (read-only session; see README.md)
schema: lotfit.query-eval/0
written_by: CC
written_on: "2026-11-01"
graph_load:
  id: "ad9a4b7a7b68a551cac9ffde0a0ec6357943c175d6782a7dff5da712ca6e17a4@2026-11-02T08:52:31.555642+00:00"
  loaded_at: "2026-11-02T04:45:30.448796+00:00"
items:

  # ---------------------------------------------------------------- numeric standards by zone (tables)
  - id: E001
    patterns: [ param-by-zone, table-cell, in-force ]
    as_of: "2026-11-01"
    questions:
      - "PDX R5 base-zone max height, in force 2026-11-01?"
      - "What is the maximum building height in Portland's R5 zone today?"
      - "How tall may a structure be under the R5 base-zone development standards as of November 1, 2026?"
    gold_cypher: |
      MATCH (p:Provision)-[:HAS_VERSION]->(v:Version)-[:HAS_PARAMETER]->(pa:Parameter)-[:APPLIES_TO_ZONE]->(:Zone {id: 'PDX:R5'})
      MATCH (pa)-[:FROM_CELL]->(c:TableCell)
      WHERE c.row = 'Maximum Height'
        AND (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN pa.value_num AS value, pa.unit AS unit, p.id AS provision_id, c.table AS table, pa.footnotes AS footnotes
    compare_on: [ value, unit, provision_id, footnotes ]
    expected:
      - { "value": 30, "unit": "ft", "provision_id": "PDX.T110-4", "footnotes": [ "3" ] }
    expect_empty: false
    notes: |-
      Table 110-4 row Maximum Height, column R5 reads "30 ft. [3]" (DOC-PDX-33110 p.11, checked against the text). This is the base-zone height, not the detached-ADU height (that is 20 ft, E010): a classic trap. Footnote [3] must come back.

  - id: E002
    patterns: [ param-by-zone, table-cell, in-force ]
    as_of: "2026-11-01"
    questions:
      - "PDX R7 side + rear building setbacks?"
      - "How far must a building stay from the side and rear lot lines in Portland's R7 zone?"
      - "Minimum interior-side and back-yard setbacks for the R7 single-dwelling zone, current edition?"
    gold_cypher: |
      MATCH (p:Provision)-[:HAS_VERSION]->(v:Version)-[:HAS_PARAMETER]->(pa:Parameter)-[:APPLIES_TO_ZONE]->(:Zone {id: 'PDX:R7'})
      MATCH (pa)-[:FROM_CELL]->(c:TableCell)
      WHERE c.row IN ['Side building setback', 'Rear building setback']
        AND (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN c.row AS row, pa.value_num AS value, pa.unit AS unit, p.id AS provision_id
    compare_on: [ row, value, unit, provision_id ]
    expected:
      - { "row": "Rear building setback", "value": 5, "unit": "ft", "provision_id": "PDX.T110-4" }
      - { "row": "Side building setback", "value": 5, "unit": "ft", "provision_id": "PDX.T110-4" }
    expect_empty: false
    notes: |-
      5 ft each (Table 110-4). SCHEMA.md warns the side and rear rows read identically in pdftotext, so the row label is the extraction's claim backed by row_sequence evidence; the values match the PDF text order.

  - id: E003
    patterns: [ param-by-zone, table-cell, zone-enumeration ]
    as_of: "2026-11-01"
    questions:
      - "Front building setback, every PDX single-dwelling zone."
      - "List the minimum front setback for each of Portland's single-dwelling zones."
      - "Across RF through R2.5, how deep is the required front yard for a building?"
    gold_cypher: |
      MATCH (z:Zone {layer: 'PDX', single_dwelling: true})<-[:APPLIES_TO_ZONE]-(pa:Parameter)-[:FROM_CELL]->(c:TableCell {row: 'Front building setback'})
      MATCH (v:Version)-[:HAS_PARAMETER]->(pa)
      WHERE (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN z.zone_code AS zone, pa.value_num AS value, pa.unit AS unit
    compare_on: [ zone, value, unit ]
    expected:
      - { "zone": "R2.5", "value": 10, "unit": "ft" }
      - { "zone": "R5", "value": 10, "unit": "ft" }
      - { "zone": "R7", "value": 15, "unit": "ft" }
      - { "zone": "R10", "value": 20, "unit": "ft" }
      - { "zone": "R20", "value": 20, "unit": "ft" }
      - { "zone": "RF", "value": 20, "unit": "ft" }
    expect_empty: false
    notes: |-
      RF/R20/R10 20 ft, R7 15 ft, R5/R2.5 10 ft (Table 110-4 p.11). For a detached ADU the 40-ft rule of 33.205.040.C.2 (E026) governs placement instead; this question is about the base setback only.

  - id: E004
    patterns: [ footnote, table-cell, clause-ledger ]
    as_of: "2026-11-01"
    questions:
      - "Footnote on PDX R10 max-height cell: text?"
      - "The R10 height in Table 110-4 has a footnote marker. What does the footnote say?"
      - "What note is attached to the ten-thousand zone's height limit in Portland's summary table?"
    gold_cypher: |
      MATCH (c:TableCell {table: 'Table 110-4', row: 'Maximum Height', column: 'R10'})<-[:ON_CELL]-(f:Clause {kind: 'footnote'})
      RETURN c.cell AS cell, f.footnote_text AS footnote_text, f.status AS status
    compare_on: [ cell, footnote_text, status ]
    expected:
      - { "cell": "30 ft. [3]", "footnote_text": "[3] Additional FAR and height may be allowed. See 33.110.265.F.", "status": "not_modeled" }
    expect_empty: false
    notes: |-
      "[3] Additional FAR and height may be allowed. See 33.110.265.F." (DOC-PDX-33110 line ~1152, verified). The footnote clause is not_modeled, so an evaluator must treat it as NEEDS_CHECK.

  - id: E005
    patterns: [ footnote, table-cell, param-by-zone ]
    as_of: "2026-11-01"
    questions:
      - "Which PDX zones have a footnoted max-height cell?"
      - "In which Portland single-dwelling zones does the maximum height carry a footnote?"
      - "For which zones is the height limit in the summary table qualified by a note?"
    gold_cypher: |
      MATCH (p:Provision {id: 'PDX.T110-4'})-[:HAS_VERSION]->(:Version)-[:HAS_TABLE_CELL]->(c:TableCell {row: 'Maximum Height'})
      WHERE size(c.footnotes) > 0
      RETURN c.column AS zone, c.footnotes AS footnotes
    compare_on: [ zone, footnotes ]
    expected:
      - { "zone": "R10", "footnotes": [ "3" ] }
      - { "zone": "R20", "footnotes": [ "3" ] }
      - { "zone": "R5", "footnotes": [ "3" ] }
      - { "zone": "R7", "footnotes": [ "3" ] }
    expect_empty: false
    notes: "R20, R10, R7, R5 carry [3]; RF (30 ft) and R2.5 (35 ft) carry none (p.11)."

  - id: E006
    patterns: [ param-by-zone, table-cell, footnote, gresham ]
    as_of: "2026-11-01"
    questions:
      - "GRE LDR-7 max building height + footnote text?"
      - "What is Gresham's maximum building height in LDR-7, and what does its footnote say?"
      - "In Gresham's Low Density Residential-7 district, how tall can a building be and what qualifies that number?"
    gold_cypher: |
      MATCH (v:Version)-[:HAS_PARAMETER]->(pa:Parameter)-[:APPLIES_TO_ZONE]->(:Zone {id: 'GRE:LDR-7'})
      MATCH (pa)-[:FROM_CELL]->(c:TableCell)
      WHERE c.row_group STARTS WITH 'H. Maximum Building Height'
        AND (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      OPTIONAL MATCH (c)<-[:ON_CELL]-(f:Clause {kind: 'footnote'})
      RETURN pa.value_num AS value, pa.unit AS unit, pa.provision_id AS provision_id, f.footnote_text AS footnote_text
    compare_on: [ value, unit, provision_id, footnote_text ]
    expected:
      - { "value": 35, "unit": "ft", "provision_id": "GRE.T4.0130", "footnote_text": "[11] A height bonus applies to affordable housing development. See Section 10.1700." }
    expect_empty: false
    notes: |-
      35 ft, Table 4.0130 row H, footnote [11] "A height bonus applies to affordable housing development. See Section 10.1700." For an ADU, 10.0110.D adds "shall not exceed the height of the primary dwelling" (E044).

  - id: E007
    patterns: [ table-cell, gresham, adu-standard ]
    as_of: "2026-11-01"
    questions:
      - "GRE freestanding ADU setbacks, all columns (Table 10.0110)."
      - "What setbacks apply to a detached accessory dwelling in Gresham?"
      - "How close to the street, side and back lot lines can a freestanding granny flat sit in Gresham?"
    gold_cypher: |
      MATCH (:Provision {id: 'GRE.T10.0110'})-[:HAS_VERSION]->(v:Version)-[:HAS_TABLE_CELL]->(c:TableCell {row: 'B. Freestanding Accessory Dwellings'})
      WHERE (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN c.column AS column, c.cell AS cell
    compare_on: [ column, cell ]
    expected:
      - { "column": "REAR NO ALLEY", "cell": "10 ft." }
      - { "column": "INTERIOR SIDE", "cell": "5 ft." }
      - { "column": "REAR WITH ALLEY", "cell": "5 ft." }
      - { "column": "STREET", "cell": "No closer than the primary dwelling" }
    expect_empty: false
    notes: |-
      Interior side 5 ft, rear no alley 10 ft, rear with alley 5 ft, street "No closer than the primary dwelling". The street cell is text, not a parameter, so a query over Parameters alone misses one of four answers. That cell has a gray-area Reading (E029).

  - id: E008
    patterns: [ param, gresham, adu-standard, citation ]
    as_of: "2026-11-01"
    questions:
      - "GRE ADU max floor area params + quotes."
      - "How big can an accessory dwelling be in Gresham?"
      - "What size ceiling does Gresham put on an ADU's floor area, and how are the two limits combined?"
    gold_cypher: |
      MATCH (:Provision {id: 'GRE.10.0110.F'})-[:HAS_VERSION]->(v:Version)-[:HAS_PARAMETER]->(pa:Parameter)
      WHERE (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN pa.name AS name, pa.value_json AS value_json, pa.unit AS unit, pa.quote AS quote
    compare_on: [ value_json, unit, quote ]
    expected:
      - { "value_json": "75", "unit": "%", "quote": "75 percent of the floor area of the primary dwelling" }
      - { "value_json": "900", "unit": "sqft", "quote": "maximum floor area of 900 square feet" }
      - { "value_json": "\"whichever is less\"", "unit": null, "quote": "whichever is less" }
    expect_empty: false
    notes: |-
      900 sq ft or 75 percent of the primary dwelling's floor area, "whichever is less" (stored as a third, string-valued parameter). Compared on value_json, not name, so a model need not guess the parameter names.

  # ---------------------------------------------------------------- Portland ADU standards, citations, multi-hop
  - id: E009
    patterns: [ param, citation, document ]
    as_of: "2026-11-01"
    questions:
      - "PDX ADU size cap: values, doc title, page, quote."
      - "What is the maximum size of an ADU in Portland, and where exactly is that written?"
      - "Give me the living-area limits for a Portland accessory unit with the source document, page and the words that set them."
    gold_cypher: |
      MATCH (p:Provision {id: 'PDX.33.205.040.C.1'})-[:HAS_VERSION]->(v:Version)-[:HAS_PARAMETER]->(pa:Parameter)
      MATCH (v)-[:FROM_DOCUMENT]->(d:Document)
      WHERE pa.unit IN ['%', 'sqft']
        AND (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN pa.value_num AS value, pa.unit AS unit, d.title AS document, pa.page AS page, pa.quote AS quote
    compare_on: [ value, unit, document, page, quote ]
    expected:
      - { "value": 75, "unit": "%", "document": "Title 33, Chapter 33.205 Accessory Dwelling Units", "page": 3, "quote": "may be no more than 75 percent of the living area of the primary dwelling unit" }
      - { "value": 800, "unit": "sqft", "document": "Title 33, Chapter 33.205 Accessory Dwelling Units", "page": 3, "quote": "or 800 square feet of living area, whichever is less" }
    expect_empty: false
    notes: |-
      75 percent of the primary unit's living area or 800 sq ft, whichever is less; Title 33 Chapter 33.205, p.3. The basement-conversion parameter (5 years) is a carve-out, excluded by unit.

  - id: E010
    patterns: [ multi-hop, refers-to, param, adu-standard ]
    as_of: "2026-11-01"
    questions:
      - "Detached ADU max height PDX, via 33.205.040.C.3's cross-references."
      - "How tall can a detached ADU be in Portland?"
      - "Following the ADU chapter's pointer to the accessory-structure standards, what height limit does a backyard cottage get?"
    gold_cypher: |
      MATCH (adu:Provision {id: 'PDX.33.205.040.C.3'})-[:REFERS_TO]->(acc:Provision)-[:HAS_VERSION]->(v:Version)-[:HAS_PARAMETER]->(pa:Parameter)
      WHERE pa.unit = 'ft' AND pa.name = 'max_height'
        AND (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN acc.id AS provision_id, pa.value_num AS value, pa.unit AS unit, pa.quote AS quote
    compare_on: [ provision_id, value, unit ]
    expected:
      - { "provision_id": "PDX.33.110.245.C.1", "value": 20, "unit": "ft" }
    expect_empty: false
    notes: |-
      20 ft from 33.110.245.C.1 (p.25), reached through 33.205.040.C.3 ("must meet the development standards for covered accessory structures"). Not the 30 ft base-zone height and not the 15 ft in-setback limit of C.2. The gold filter on pa.name is a convenience; a candidate that returns only the 20-ft row from C.1 is right.

  - id: E011
    patterns: [ in-force, before-edition, empty ]
    as_of: "2026-10-15"
    questions:
      - "PDX ADU size cap in force 2026-10-15?"
      - "What was Portland's maximum ADU size on October 15, 2026?"
      - "Before the November 2026 edition took effect, what living-area limit applied to a Portland accessory unit?"
    gold_cypher: |
      MATCH (p:Provision {layer: 'PDX'})-[:HAS_VERSION]->(v:Version)-[:HAS_PARAMETER]->(pa:Parameter)
      WHERE 'T03' IN p.topics
        AND (v.when_from IS NULL OR v.when_from <= '2026-10-15') AND (v.when_to IS NULL OR v.when_to > '2026-10-15')
      RETURN p.id AS provision_id, pa.name AS name, pa.value_num AS value
    compare_on: [ provision_id, name, value ]
    expected: []
    expect_empty: true
    notes: |-
      The graph holds only the 11/1/26 edition of 33.205; the earlier text is not loaded, so on 2026-10-15 nothing is in force (SCHEMA.md: NOT_MODELED for that date). Returning the 75%/800 sq ft values ignores the date and is wrong.

  - id: E012
    patterns: [ in-force, before-edition, topic ]
    as_of: "2026-10-15"
    questions:
      - "PDX ADU short-term-rental provisions in force 2026-10-15."
      - "Which Portland rules on renting out an ADU short-term were already in force in mid-October 2026?"
      - "On 15 Oct 2026, what Portland accessory short-term rental provisions mention accessory dwelling units?"
    gold_cypher: |
      MATCH (p:Provision {layer: 'PDX'})-[:HAS_VERSION]->(v:Version)
      WHERE 'T12' IN p.topics AND toLower(p.title) CONTAINS 'accessory dwelling'
        AND (v.when_from IS NULL OR v.when_from <= '2026-10-15') AND (v.when_to IS NULL OR v.when_to > '2026-10-15')
      RETURN p.id AS provision_id, v.when_from AS in_force_from
    compare_on: [ provision_id, in_force_from ]
    expected:
      - { "provision_id": "PDX.33.207.040.B.2.part2", "in_force_from": "2024-10-01" }
      - { "provision_id": "PDX.33.207.040.B.2", "in_force_from": "2024-10-01" }
      - { "provision_id": "PDX.33.207.050.B.2", "in_force_from": "2024-10-01" }
    expect_empty: false
    notes: |-
      Chapter 33.207 is dated 10/1/24 and so is in force before Portland's 11/1/26 edition; the contrast case to E011.

  - id: E013
    patterns: [ in-force, not-stated-date, state-law, versions ]
    as_of: "2027-06-01"
    questions:
      - "OR design-standards limit (2025 c.330 s.8): version in force 2027-06-01, date stated?"
      - "Which version of Oregon's limit on residential design standards applies on June 1, 2027?"
      - "Mid-2027, which text of the state rule capping design standards for housing is the operative one, and is its start date known?"
    gold_cypher: |
      MATCH (p:Provision {id: 'ORLAW.2025.330.8'})-[:HAS_VERSION]->(v:Version)
      WHERE (v.when_from IS NULL OR v.when_from <= '2027-06-01') AND (v.when_to IS NULL OR v.when_to > '2027-06-01')
      RETURN v.version AS version, v.when_from IS NULL AS date_not_stated, v.when_to AS in_force_until
    compare_on: [ version, date_not_stated, in_force_until ]
    expected:
      - { "version": 1, "date_not_stated": true, "in_force_until": "2028-01-01" }
    expect_empty: false
    notes: |-
      Version 1: no effective date in the extracted text (included but flagged), ends 2028-01-01. Version 2 is effective 2027-01-01 but operative only 2028-01-01, so a query on effective_from alone wrongly returns v2 too.

  - id: E014
    patterns: [ in-force, operative-date, state-law, versions, multi-hop ]
    as_of: "2028-06-01"
    questions:
      - "OR design-standards limit in force 2028-06-01: version, params, operative-by section."
      - "From 2028, which version of Oregon's residential design-standard limit applies, what number does it carry, and which section made it operative?"
      - "After the 2026 amendment kicks in, what unit threshold does the state's design-standards cap use, and what provision set its operative date?"
    gold_cypher: |
      MATCH (p:Provision {id: 'ORLAW.2025.330.8'})-[:HAS_VERSION]->(v:Version)
      WHERE (v.when_from IS NULL OR v.when_from <= '2028-06-01') AND (v.when_to IS NULL OR v.when_to > '2028-06-01')
      OPTIONAL MATCH (v)-[:HAS_PARAMETER]->(pa:Parameter)
      OPTIONAL MATCH (v)-[:OPERATIVE_BY]->(ov:Version)
      RETURN v.version AS version, v.operative_from AS operative_from, pa.value_num AS value, ov.provision_id AS operative_by
    compare_on: [ version, operative_from, value, operative_by ]
    expected:
      - { "version": 2, "operative_from": "2028-01-01", "value": 20, "operative_by": "ORLAW.2026.79.14" }
    expect_empty: false
    notes: |-
      v2, operative 2028-01-01 by ORLAW.2026.79.14 (SB 1521 s.14: "become operative on January 1, 2028"), parameter design_standards_max_units = 20 ("fewer than 20 residential units"). v1 carries no parameter.

  - id: E015
    patterns: [ not-stated-date, provision-type, state-law ]
    as_of: null
    questions:
      - "OR preemption provisions with no stated effective date."
      - "Which state preemption rules in the graph have no effective date printed?"
      - "For which state-law overrides do we not know when they took effect?"
    gold_cypher: |
      MATCH (p:Provision {layer: 'OR', type: 'preemption'})-[:HAS_VERSION]->(v:Version)
      WHERE v.when_from IS NULL
      RETURN p.id AS provision_id, v.version AS version
    compare_on: [ provision_id, version ]
    expected:
      - { "provision_id": "ORLAW.2025.330.8", "version": 1 }
      - { "provision_id": "ORS.105.880", "version": 1 }
      - { "provision_id": "ORS.197A.400.1", "version": 1 }
      - { "provision_id": "ORS.197A.420.4", "version": 1 }
      - { "provision_id": "ORS.197A.425", "version": 1 }
      - { "provision_id": "ORS.227.175.4.b", "version": 1 }
    expect_empty: false
    notes: |-
      ORS sections from the 2025 Edition print no date; ORLAW.2025.330.8 v1 too. Asked per version: ORLAW.2025.330.8 v2 has a date and must not appear.

  - id: E016
    patterns: [ not-stated-date, provision-type, gresham ]
    as_of: null
    questions:
      - "GRE gates with no stated effective date."
      - "Which Gresham applicability or prohibition rules have no known effective date?"
      - "Among Gresham's threshold rules (the ones that decide whether something applies at all), which lack a start date?"
    gold_cypher: |
      MATCH (p:Provision {layer: 'GRE', type: 'gate'})-[:HAS_VERSION]->(v:Version)
      WHERE v.when_from IS NULL
      RETURN p.id AS provision_id, p.title AS title
    compare_on: [ provision_id ]
    expected:
      - { "provision_id": "GRE.5.0703.A" }
      - { "provision_id": "GRE.5.0704" }
    expect_empty: false
    notes: "The Natural Resource Overlay pages are footed (07/26), not covered by the June 4, 2026 effective-date page."

  # ---------------------------------------------------------------- state law and layering
  - id: E017
    patterns: [ provision-type, state-law, param, topic ]
    as_of: "2026-11-01"
    questions:
      - "OR ADU mandate (S01): provision + numeric params."
      - "What does Oregon's ADU statute require, in numbers?"
      - "Under the state law forcing cities to allow ADUs, which cities and counties are covered and how many units per house?"
    gold_cypher: |
      MATCH (p:Provision {layer: 'OR'})-[:HAS_VERSION]->(v:Version)-[:HAS_PARAMETER]->(pa:Parameter)
      WHERE 'S01' IN p.topics
        AND (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN p.id AS provision_id, p.type AS type, pa.value_num AS value, pa.unit AS unit, pa.quote AS quote, v.when_from IS NULL AS date_not_stated
    compare_on: [ provision_id, type, value, unit, date_not_stated ]
    expected:
      - { "provision_id": "ORS.197A.425", "type": "preemption", "value": 1, "unit": "count", "date_not_stated": true }
      - { "provision_id": "ORS.197A.425", "type": "preemption", "value": 15000, "unit": "count", "date_not_stated": true }
      - { "provision_id": "ORS.197A.425", "type": "preemption", "value": 2500, "unit": "count", "date_not_stated": true }
    expect_empty: false
    notes: |-
      ORS 197A.425: city population over 2,500 or county over 15,000; at least one ADU per detached single-unit dwelling. Date not stated (2025 Edition), so it is included and flagged.

  - id: E018
    patterns: [ layering, under-state, provision-type, in-force, gresham ]
    as_of: "2026-11-01"
    questions:
      - "State over Gresham: preemption provisions in force 2026-11-01 (flag undated)."
      - "Which state preemption rules sit above Gresham's code on November 1, 2026?"
      - "Through Gresham's parent jurisdiction, what state-level overrides are in effect today, and which have no printed date?"
    gold_cypher: |
      MATCH (:Jurisdiction {id: 'OR-GRESHAM'})-[:UNDER_STATE]->(s:Jurisdiction)<-[:IN_JURISDICTION]-(p:Provision {type: 'preemption'})-[:HAS_VERSION]->(v:Version)
      WHERE (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN s.id AS state, p.id AS provision_id, v.when_from IS NULL AS date_not_stated
    compare_on: [ state, provision_id, date_not_stated ]
    expected:
      - { "state": "OR-STATE", "provision_id": "ORLAW.2025.38.25.cont", "date_not_stated": false }
      - { "state": "OR-STATE", "provision_id": "ORLAW.2025.38.25", "date_not_stated": false }
      - { "state": "OR-STATE", "provision_id": "ORLAW.2025.38.9.cont", "date_not_stated": false }
