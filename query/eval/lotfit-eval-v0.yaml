      - { "fact": "plan.outline", "computed_from": "plan.placement" }
      - { "fact": "site.house_rear_wall", "computed_from": "site.house_main_entrance" }
      - { "fact": "site.house_rear_wall", "computed_from": "site.house_outline" }
