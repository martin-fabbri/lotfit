  - id: E037
    patterns: [ modifies, operator, not-modeled, multi-hop, modeled-layer ]
    as_of: null
    questions:
      - "Exceptions MODIFYING PDX.33.110.220.B with no operator."
      - "Which carve-outs to Portland's base setbacks does the engine have no check for?"
