      MATCH (:Provision {id: 'PDX.33.110.245.C.2'})-[:HAS_VERSION]->(v:Version)-[:HAS_PARAMETER]->(pa:Parameter)
      WHERE (v.when_from IS NULL OR v.when_from <= '2026-11-01') AND (v.when_to IS NULL OR v.when_to > '2026-11-01')
      RETURN pa.value_json AS value_json, pa.unit AS unit, pa.quote AS quote
    compare_on: [ value_json, unit ]
    expected:
      - { "value_json": "10", "unit": "ft" }
      - { "value_json": "15", "unit": "ft" }
      - { "value_json": "20", "unit": "ft" }
      - { "value_json": "24", "unit": "ft" }
      - { "value_json": "24", "unit": "ft" }
      - { "value_json": "40", "unit": "ft" }
      - { "value_json": "5", "unit": "ft" }
      - { "value_json": "6", "unit": "ft" }
      - { "value_json": "[\"R7\", \"R5\", \"R2.5\"]", "unit": null }
    expect_empty: false
    notes: |-
      40 ft from front lot line, 20 ft from a side street lot line (corner), 24x24 ft footprint, 24 ft combined length per line, 15 ft high, 10 ft walls, dormers 5 ft back, zones R7/R5/R2.5, and cisterns 6 ft (item a). Verified against p.25 text. Items (5)-(7) (screening, openings, rooftop deck) carry no number (E025).

  - id: E024
    patterns: [ param, coverage, adu-standard ]
