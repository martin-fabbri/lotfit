<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LotFit · Decision-Trace Walkthrough</title>
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2); }
@font-face { font-family: Inter; font-weight: 500; src: url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2); }
@font-face { font-family: Inter; font-weight: 600; src: url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); }
@font-face { font-family: Inter; font-weight: 700; src: url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2); }
@font-face { font-family: Mono; font-weight: 400; src: url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2); }
@font-face { font-family: Mono; font-weight: 500; src: url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2); }

:root {
  --bg: #0d1117; --ink: #e8edf3; --muted: #8b97a6; --line: rgba(232,237,243,.14);
  --red: #ff5d5d; --amber: #f5b342; --orange: #ff8a4c; --cyan: #4fd1c5; --green: #5ee08a; --ana: #4fd1c5; --leo: #f5b342;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); font-family: Inter, sans-serif; color: var(--ink); }
#stage { position: relative; width: 1280px; height: 720px; }
canvas { position: absolute; inset: 0; display: block; }
#labels, #hud { position: absolute; inset: 0; pointer-events: none; }

.lbl { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 600 13px/1 Inter; letter-spacing: .01em;
  padding: 5px 8px; border-radius: 6px; background: rgba(13,17,23,.82); border: 1px solid var(--line); }
.lbl.big { font-size: 16px; padding: 7px 11px; }
.lbl .k { font: 500 11px Mono; color: var(--muted); margin-right: 6px; }

#brand { position: absolute; left: 36px; top: 30px; font: 500 12px Mono; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
#chapter { position: absolute; left: 36px; top: 52px; font: 700 28px/1.1 Inter; letter-spacing: -.01em; }

#card { position: absolute; right: 36px; top: 96px; width: 364px; padding: 18px 20px; border-radius: 12px;
  background: rgba(17,22,30,.9); border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
#card .src { font: 500 12px Mono; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
#card .ttl { font: 600 18px/1.25 Inter; margin-bottom: 6px; }
#card .val { font: 500 15px/1.35 Inter; color: var(--ink); opacity: .9; }
#card .rsn { margin-top: 10px; font: 400 13px/1.4 Inter; color: var(--muted); }
#card .chip { font: 600 11px Mono; padding: 3px 7px; border-radius: 4px; letter-spacing: .06em; }
#card .chip.no { background: rgba(255,93,93,.16); color: var(--red); }
#card .chip.ok { background: rgba(94,224,138,.16); color: var(--green); }
#card .chip.rule { background: rgba(232,237,243,.08); color: var(--ink); }
#card .metric { display: flex; justify-content: space-between; font: 500 13px Inter; padding: 6px 0; border-top: 1px solid var(--line); gap: 8px; }
#card .metric:first-of-type { margin-top: 10px; }
#card .metric b { font: 500 13px Mono; }
#card .chk { display: flex; gap: 10px; align-items: baseline; font: 500 13px/1.3 Inter; padding: 5px 0; border-top: 1px solid var(--line); }
#card .chk i { font-style: normal; color: var(--green); font-weight: 700; }
#card .chk span.s { font: 400 11px Mono; color: var(--muted); margin-left: auto; white-space: nowrap; }
.strike { text-decoration: line-through; color: var(--red); }

#sun { position: absolute; right: 36px; top: 30px; font: 500 12px Mono; color: var(--amber); display: flex; gap: 8px; align-items: center; opacity: 0; }
#sun .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber); }

#cap { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); width: 900px; text-align: center; opacity: 0; }
#cap .who { font: 600 12px Mono; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
#cap .txt { display: inline; font: 500 21px/1.45 Inter; padding: 3px 10px; background: rgba(13,17,23,.78); -webkit-box-decoration-break: clone; box-decoration-break: clone; border-radius: 4px; }
#cap .txt span { color: rgba(232,237,243,.42); }
#cap .txt span.on { color: var(--ink); }

#title { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding-left: 96px; background: linear-gradient(90deg, rgba(13,17,23,.92), rgba(13,17,23,.2)); }
#title .k { font: 500 13px Mono; color: var(--cyan); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 16px; }
#title h1 { font: 700 48px/1.05 Inter; letter-spacing: -.02em; max-width: 680px; }
#title p { margin-top: 16px; font: 400 17px/1.4 Inter; color: var(--muted); max-width: 560px; }
#disc { position: absolute; right: 36px; bottom: 14px; font: 400 10.5px Mono; color: rgba(139,151,166,.7); }
</style>
</head>
<body data-trace="../out/s1-trace.json">
<div id="stage">
  <div id="labels"></div>
  <div id="hud">
    <div id="brand">BuildNexus · LotFit decision-trace player</div>
    <div id="chapter"></div>
    <div id="sun"><div class="dot"></div><span></span></div>
    <div id="card"></div>
    <div id="cap"><div class="who"></div><div class="txt"></div></div>
    <div id="title"><div class="k">Pre-feasibility walkthrough</div><h1></h1><p></p></div>
    <div id="disc">Pre-feasibility only · not a permit decision</div>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
<script type="module" src="scene.js"></script>
</body>
</html>
